<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gravuru · R15-Beta</title>
  <style>
    *{box-sizing:border-box} [hidden]{display:none!important} body{margin:0;height:100dvh;display:flex;flex-direction:column;font:15px/1.45 system-ui,sans-serif;color:#243b35;background:#f5f7f5}
    header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.25rem 1rem;padding:.3rem 1rem;border-bottom:1px solid #cad6cf}
    nav{display:flex;align-items:center;gap:0 .85rem;flex-wrap:wrap} a,.text-btn{color:#205948;text-underline-offset:.2em}
    a[aria-current]{font-weight:700} nav a,.text-btn{display:inline-flex;align-items:center;min-height:44px} button{font:inherit;cursor:pointer}
    .text-btn{border:0;padding:0;background:transparent;text-decoration:underline} :focus-visible{outline:3px solid #276e52;outline-offset:2px}
    #editor{flex:1;min-height:0}iframe{display:block;width:100%;height:100%;border:0}
    #status{padding:0 1rem;margin:.3rem 0}#status:empty{display:none}
    #cart{overflow:auto;width:min(100%,56rem);margin:0 auto;padding:.5rem clamp(.8rem,3vw,2rem) 2rem}
    h1{font-size:clamp(1.4rem,4vw,2rem);margin:.3rem 0 .8rem} .line{display:grid;grid-template-columns:clamp(90px,25vw,152px) minmax(0,1fr);gap:.75rem;align-items:start;background:#fff;border:1px solid #c8d4cc;border-radius:.5rem;padding:.7rem;margin:.45rem 0}
    .line h2{margin:0;font-size:1.04rem;line-height:1.25}.line p{margin:.23rem 0;overflow-wrap:anywhere}.line .options{color:#495e55;font-size:.84rem}
    .image-box{min-height:60px}.image-box img{display:block;width:100%;max-height:158px;object-fit:contain}.image-box a{display:block}.image-box span{font-size:.85rem}.remove{margin-top:.15rem}
    .sum{display:block;text-align:right;margin:.7rem 0;font-size:1.15rem}.proofs{grid-template-columns:1fr}.proofs button,.drawer-close{min-height:44px;margin:.18rem .35rem .1rem 0}
    dialog{position:fixed;inset:0 0 0 auto;margin:0;width:min(100%,30rem);max-width:100%;height:100dvh;max-height:100dvh;border:0;border-left:1px solid #cad6cf;padding:1rem;background:#f5f7f5;color:inherit;overflow:auto}
    dialog::backdrop{background:#142e286b}.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:1rem}.drawer-head h2{margin:0}.drawer-close{padding:0 .75rem}
    @media(max-width:600px){header{font-size:13px;padding:.25rem .65rem}nav{gap:0 .75rem}#status{font-size:.87rem}.line{padding:.55rem;gap:.6rem}}
  </style>
</head>
<body>
  <header><strong>Gravuru · R15-Beta</strong><nav aria-label="Prüfprodukte und Warenkorb">
    <a href="/?produkt=ring">Ring</a><a href="/?produkt=heimathafen">Heimathafen</a><a href="/?produkt=acryl">Acryl mit Foto</a><!--slate-link--><a href="/beta/cart">Warenkorb</a><button class="text-btn" id="basket" aria-haspopup="dialog" type="button">Kurzansicht</button><a href="/beta/dateien">Prüfdateien</a>
  </nav></header>
  <p id="status" role="status">Editor wird geladen …</p>
  <main id="editor"></main>
  <section id="cart" aria-labelledby="cart-title" hidden><h1 id="cart-title">Testwarenkorb</h1><div id="items"></div><strong class="sum" id="sum"></strong></section>
  <dialog id="drawer" aria-labelledby="drawer-title"><div class="drawer-head"><h2 id="drawer-title">Dein Warenkorb</h2><button type="button" class="drawer-close" autofocus>Schließen</button></div><div class="drawer-items"></div><strong class="sum"></strong><a href="/beta/cart">Warenkorb öffnen</a></dialog>
  <script type="module" src="/beta-client.mjs"></script>
</body>
</html>
