# Shopify-Funktion des Neuaufbaus (konfi-neu). Noch NICHT eingespielt; Einspielen macht nur Chris bzw. der Operator
# nach Freigabe. Eine uid steht hier bewusst nicht: Shopify CLI trägt sie beim ersten `shopify app dev` selbst ein.
api_version = "2026-07"

[[extensions]]
name = "gravuru Konfi – Preis"
handle = "gravuru-konfi-preis"
type = "function"
description = "Setzt den Stückpreis einer gestalteten Zeile: Variantenpreis plus unterschriebener Aufpreis, abzüglich Mengenstaffel."

  [[extensions.targeting]]
  target = "cart.transform.run"
  input_query = "src/cart_transform_run.graphql"
  export = "cart_transform_run"

  [extensions.build]
  command = "cargo build --target=wasm32-unknown-unknown --release"
  path = "target/wasm32-unknown-unknown/release/gravuru-konfi-preis.wasm"
  watch = ["src/**/*.rs", "../../funktion/rust/src/**/*.rs"]
