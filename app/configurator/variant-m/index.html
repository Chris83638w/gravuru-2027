<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gravuru 2027 · Dein Acrylglasbild</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font:16px/1.5 Arial,sans-serif;color:#273b32;background:#f7f7f3}main{max-width:720px;margin:8vh auto;padding:24px}h1{font-size:clamp(24px,4vw,36px)}button{font:inherit;padding:14px 24px;border:0;border-radius:8px;background:#19654f;color:white;cursor:pointer}#editor{height:100dvh;background:white}iframe{display:block;border:0;width:100%;height:100%}[hidden]{display:none!important}.eyebrow{letter-spacing:.18em;font-size:13px}#status{min-height:24px}
  </style>
</head>
<body>
  <main id="intro">
    <p class="eyebrow">GRAVURU 2027</p>
    <h1>Dein Acrylglasbild. Deine Erinnerung.</h1>
    <p>Gestalte „Unser Anfang“ mit deinem Foto, deinen Worten und deinen Farben.</p>
    <button id="open" type="button">Jetzt gestalten</button>
    <p><a href="/werkstatt">Zur Werkstatt</a></p>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <section id="editor" hidden aria-label="Acrylglasbild gestalten"></section>
  <script type="module">
    const intro=document.getElementById('intro'),editor=document.getElementById('editor'),button=document.getElementById('open'),status=document.getElementById('status');
    let pending=false;
    async function open(){
      if(pending)return;
      if(editor.querySelector('iframe')){intro.hidden=true;editor.hidden=false;editor.querySelector('iframe').contentWindow.postMessage({type:'gravuru-ux-open'},location.origin);return;}
      pending=true;button.disabled=true;status.textContent='Deine Gestaltung wird vorbereitet …';
      try{
        const params=new URL(location.href).searchParams,query=new URLSearchParams();
        if(params.has('configuration'))query.set('configuration',params.get('configuration'));
        if(params.has('revision'))query.set('revision',params.get('revision'));
        const response=await fetch('/models.json'+(query.size?'?'+query:''));
        if(!response.ok)throw Error('Produktauswahl nicht verfügbar.');
        const models=await response.json(),model=models.find(m=>m.key==='acryl');
        if(!model)throw Error('Acrylglasvorlage fehlt.');
        if(params.get('druckexport')==='1'){
          const session=await fetch('/api/workshop/session',{credentials:'same-origin'});
          if(!session.ok||(await session.json()).scope!=='local-operator')throw Error('Druckexport benötigt eine Werkstattsitzung.');
          window.GravuruOperatorExport=true;
        }
        window.GravuruModelProfile=model.legacy;window.UniversalConfig=model.universal;
        const frame=document.createElement('iframe');frame.title='Acrylglasbild personalisieren';frame.src='/editor.html';
        editor.append(frame);intro.hidden=true;editor.hidden=false;status.textContent='';
      }catch(error){status.textContent='Vorschau konnte nicht geladen werden: '+error.message;}
      finally{pending=false;button.disabled=false;}
    }
    button.addEventListener('click',open);
    window.addEventListener('message',event=>{
      if(event.origin!==location.origin||event.source!==editor.querySelector('iframe')?.contentWindow)return;
      if(event.data?.type==='gravuru-fk-close'){editor.hidden=true;intro.hidden=false;}
    });
    if(new URL(location.href).searchParams.get('model')==='acryl'||new URL(location.href).searchParams.has('configuration'))open();
  </script>
</body>
</html>
