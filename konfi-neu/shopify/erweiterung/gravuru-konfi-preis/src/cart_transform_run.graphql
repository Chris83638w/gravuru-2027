# Eingabe der Preisfunktion. Feldnamen gegen schema.graphql (Cart Transform, API 2026-07) geprüft.
query Input {
  presentmentCurrencyRate
  shop {
    schluessel: metafield(namespace: "$app", key: "konfi_schluessel") { value }
    localTime { date }
  }
  cart {
    lines {
      id
      quantity
      cost { amountPerQuantity { amount } }
      gestaltung: attribute(key: "_gravuru") { value }
      preis: attribute(key: "_gravuru_preis") { value }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product { konfi: metafield(namespace: "custom", key: "customization_id") { value } }
        }
      }
    }
  }
}
