<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ihr Warenkorb · gravuru</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fafaf8;color:#253c36;font:16px/1.46 "Segoe UI",system-ui,sans-serif}header{border-bottom:1px solid #dbe1da;background:white}.bar,main{width:min(1040px,100%);margin:auto;padding:18px 26px}.bar{display:flex;align-items:center;justify-content:space-between}.logo{font:600 32px/1 Georgia,serif;letter-spacing:-1.8px;color:#244b40}.bar small{color:#607168}h1{font-size:clamp(27px,4.3vw,40px);margin:15px 0 20px;letter-spacing:-1.2px}h2,p,figure{margin:0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:28px;align-items:start}ul{list-style:none;margin:0;padding:0}.line{display:grid;grid-template-columns:138px 1fr;gap:20px;border-top:1px solid #d1dbd2;padding:16px 0}.imagebox{display:grid;place-items:center;background:#eeefeb;border-radius:8px;height:150px;padding:6px;overflow:hidden}.imagebox img{width:100%;height:100%;object-fit:contain;min-height:0}.imagebox span{font-size:13px;text-align:center}.imagebox [hidden]{display:none}h2{font-size:17px;line-height:1.25}.design{margin-top:4px;font-size:14px}.text{font-weight:600;margin:6px 0 2px}.options,.quantity{font-size:13px;color:#52635d}.end{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}button{cursor:pointer;color:#365b4b;border:0;padding:0;background:none;text-decoration:underline;font:inherit;font-size:13px}.summary{border:1px solid #d7dfd6;background:white;padding:17px 19px;border-radius:8px;display:flex;justify-content:space-between;gap:12px}.summary strong{white-space:nowrap}.foot{margin-top:11px;color:#62736a;font-size:12px}#notice{color:#754924}@media(max-width:720px){.bar,main{padding:12px 16px}.logo{font-size:29px}.layout{display:flex;flex-direction:column;gap:12px}ul,.summary{width:100%}.line{grid-template-columns:100px 1fr;gap:12px;padding:12px 0}.imagebox{height:132px}h2{font-size:15px}.design,.options,.quantity{font-size:12px}.text{font-size:14px}.summary{padding:11px 14px}h1{margin:6px 0 10px}}
.zoom{display:block;min-height:0;width:100%;height:100%;cursor:zoom-in}.zoom[hidden]{display:none}dialog{border:0;border-radius:12px;background:#fafaf8;padding:16px;max-width:92vw;max-height:94dvh}dialog::backdrop{background:#182820c9}dialog img{display:block;max-width:78vw;max-height:72dvh;object-fit:contain;margin:8px auto}dialog form{text-align:right}dialog button{font-size:15px}
</style></head><body>
<header><div class="bar"><span class="logo">gravuru</span><small>Geschützte R15-Beta</small></div></header>
<main><h1>Ihr Warenkorb</h1><p id="notice" role="status">Warenkorb wird geladen …</p>
<div class="layout"><ul aria-label="Warenkorbpositionen"></ul><div class="summary"><span>Gesamtsumme</span><strong id="total">–</strong></div></div>
<p class="foot">Lokaler Prüfwarenkorb · Preise inkl. MwSt.</p></main>
<template id="position"><li class="line"><figure class="imagebox"><span role="status">Vorschau wird geladen …</span><button type="button" class="zoom" hidden><img hidden alt=""></button></figure><div><h2></h2><p class="design"></p><p class="text"></p><p class="options"></p><p class="quantity"></p><div class="end"><button type="button">Entfernen</button><strong class="price"></strong></div></div></li></template>
<dialog aria-label="Persönliche Vorschau"><form method="dialog"><button>Schließen</button></form><img alt=""><p></p></dialog>
<script type="module" src="/beta-warenkorb.mjs"></script></body></html>
