<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gravuru · R15-Prüfstand</title>
  <style>
    *{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;font:15px/1.4 system-ui,sans-serif;color:#233833;background:#f6f7f5}
    header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.35rem 1rem;padding:.45rem 1rem;border-bottom:1px solid #cbd6d0}
    nav{display:flex;gap:1rem}a{color:#205948;text-underline-offset:.2rem}a[aria-current]{font-weight:700}
    main{flex:1;min-height:0;position:relative}iframe{display:block;width:100%;height:100%;border:0}
    #status{padding:0 1rem;margin:.35rem 0}#status:empty{display:none}
    #downloads{padding:.35rem 1rem}button{font:inherit;cursor:pointer;margin:0 .3rem .3rem 0}
    @media(max-width:600px){header{font-size:13px;padding:.35rem .65rem}nav{gap:.7rem}}
  </style>
</head>
<body>
  <header><strong>Gravuru · lokaler Prüfstand</strong><nav aria-label="Prüfprodukte">
    <a href="/?produkt=ring">Ring</a><a href="/?produkt=heimathafen">Heimathafen</a><a href="/?produkt=acryl">Acryl mit Foto</a><!--slate-link-->
  </nav></header>
  <p id="status" role="status">Editor wird geladen …</p>
  <section id="downloads" aria-label="Dateien des gesicherten Prüfstands" hidden>
    <button type="button" data-format="svg">Gestaltung als SVG</button>
    <button type="button" data-format="kontur">Kontur-PDF 1:1</button>
    <button type="button" data-format="druck" hidden>Druck-PDF</button>
    <button type="button" data-format="zip">Bearbeitbarer Entwurf und Originale</button>
  </section>
  <main id="editor"></main>
  <script type="module" src="/beta-client.mjs"></script>
</body>
</html>
