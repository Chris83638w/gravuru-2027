<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Jetzt personalisieren · Gravuru</title>
  <link rel="modulepreload" href="/konfigurator/shop/shop-entry-client.mjs">
  <style>
    html,body{margin:0;height:100%;font-family:system-ui,sans-serif;color:#292d32;background:#f5f6f7}
    body{display:flex;flex-direction:column;min-height:100dvh}
    header{display:flex;align-items:center;gap:16px;padding:16px;background:#292d32;color:#fff;position:relative;z-index:3}
    header[hidden]{display:none}
    h1{font-size:16px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #back{color:#fff;text-decoration:none;font-size:14px;white-space:nowrap}
    #loading-screen{position:fixed;inset:0;z-index:2;background:#f5f6f7;display:grid;align-content:center;justify-items:center;gap:16px;padding:24px;text-align:center}
    #loading-screen[hidden]{display:none}
    #start-preview{width:min(100%,440px);height:260px;object-fit:contain}
    #start-preview[hidden]{display:none}
    progress{width:min(100%,320px);height:6px;accent-color:#343a40}
    #status{margin:0;padding:16px;font-size:15px}
    #status[hidden]{display:none}
    main{flex:1;min-height:0}
    main[hidden]{display:none}
    iframe{display:block;width:100%;height:100%;border:0}
    @media(max-width:600px){header{padding:8px 12px}h1{font-size:15px}}
  </style>
</head>
<body>
  <header><a id="back" href="/" rel="noopener">← Zurück</a><h1 id="title">Jetzt personalisieren</h1></header>
  <section id="loading-screen" aria-label="Gestaltung wird vorbereitet">
    <img id="start-preview" alt="Dein Startdesign" hidden>
    <p id="status" role="status" aria-live="polite">Dein Produkt wird geladen …</p>
    <progress id="progress" max="3" value="0" aria-label="Ladefortschritt"></progress>
  </section>
  <main id="editor" aria-label="Produkt gestalten" hidden></main>
  <script type="module" src="/konfigurator/shop/shop-entry-page.mjs"></script>
</body>
</html>
