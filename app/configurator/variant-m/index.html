<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gravuru 2027 · Dein Acrylglasbild</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font:16px/1.5 Arial,sans-serif;color:#273b32;background:#f7f7f3}main{max-width:720px;margin:8vh auto;padding:24px}h1{font-size:clamp(24px,4vw,36px)}button{font:inherit;padding:14px 24px;border:0;border-radius:8px;background:#19654f;color:white;cursor:pointer}#editor{height:100dvh;background:white}iframe{display:block;border:0;width:100%;height:100%}[hidden]{display:none!important}.eyebrow{letter-spacing:.18em;font-size:13px}#status{min-height:24px}
  </style>
</head>
<body>
  <main id="intro">
    <p class="eyebrow">GRAVURU 2027</p>
    <h1>Dein Acrylglasbild. Deine Erinnerung.</h1>
    <p id="intro-description">Gestalte „Unser Anfang“ mit deinem Foto, deinen Worten und deinen Farben.</p>
    <button id="open" type="button">Jetzt gestalten</button>
    <p><a href="/werkstatt">Zur Werkstatt</a></p>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <section id="editor" hidden aria-label="Acrylglasbild gestalten"></section>
  <script type="module">
    const intro=document.getElementById('intro'),editor=document.getElementById('editor'),button=document.getElementById('open'),status=document.getElementById('status');
    let pending=false;
    async function open(){
      if(pending)return;
      if(editor.querySelector('iframe')){intro.hidden=true;editor.hidden=false;editor.querySelector('iframe').contentWindow.postMessage({type:'gravuru-ux-open'},location.origin);return;}
      pending=true;button.disabled=true;status.textContent='Deine Gestaltung wird vorbereitet …';
      try{
        const params=new URL(location.href).searchParams,query=new URLSearchParams();
        if(params.has('group')){
          const selected=await fetch('/api/workshop/variants/'+encodeURIComponent(params.get('group'))+'/select?'+new URLSearchParams({revision:params.get('groupRevision')||params.get('revision')||'',...(params.has('variant')?{variant:params.get('variant')}:{})}));
          const value=await selected.json();if(!selected.ok)throw Error(value.error?.message||'Ausführung nicht verfügbar.');
          params.set('configuration',value.productId);params.set('revision',value.productRevision);params.set('groupRevision',value.groupRevision);params.set('variant',value.variantId);
        }
        if(params.has('configuration'))query.set('configuration',params.get('configuration'));
        if(params.has('revision'))query.set('revision',params.get('revision'));
        const response=await fetch('/models.json'+(query.size?'?'+query:''));
        if(!response.ok)throw Error('Produktauswahl nicht verfügbar.');
        const models=await response.json(),model=models.find(m=>['acryl','form'].includes(m.key));
        if(!model)throw Error('Produktvorlage fehlt.');
        if(model.key==='form'){
          intro.querySelector('h1').textContent=model.name;document.getElementById('intro-description').textContent='Gestalte dein Produkt mit deinen Texten, Fotos und Motiven.';editor.setAttribute('aria-label','Produkt gestalten');
          const target=new URL('/form-editor.html',location.origin);target.searchParams.set('configuration',model.configuration.id);target.searchParams.set('revision',model.configuration.revision);
          for(const key of ['design','group','groupRevision','variant'])if(params.has(key))target.searchParams.set(key,params.get(key));
          const frame=document.createElement('iframe');frame.title='Produkt personalisieren';frame.src=target.pathname+target.search;editor.append(frame);intro.hidden=true;editor.hidden=false;status.textContent='';document.title=model.name+' · Gravuru';return;
        }
        if(params.get('druckexport')==='1'){
          const session=await fetch('/api/workshop/session',{credentials:'same-origin'});
          if(!session.ok||(await session.json()).scope!=='local-operator')throw Error('Druckexport benötigt eine Werkstattsitzung.');
          window.GravuruOperatorExport=true;
        }
        window.GravuruWorkshopReview=model.configuration?{productId:model.configuration.id,productRevision:model.configuration.revision}:null;
        window.GravuruModelProfile=model.legacy;window.UniversalConfig=model.universal;
        document.title=model.name+' · Gravuru';editor.setAttribute('aria-label',model.name+' gestalten');
        const frame=document.createElement('iframe');frame.title=model.name+' personalisieren';frame.src='/editor.html';
        editor.append(frame);intro.hidden=true;editor.hidden=false;status.textContent='';
      }catch(error){status.textContent='Vorschau konnte nicht geladen werden: '+error.message;}
      finally{pending=false;button.disabled=false;}
    }
    button.addEventListener('click',open);
    window.addEventListener('message',event=>{
      if(event.origin!==location.origin||event.source!==editor.querySelector('iframe')?.contentWindow)return;
      if(event.data?.type==='gravuru-form-location'){
        const current=new URL(location.href);for(const key of ['configuration','revision','design','group','groupRevision','variant']){const value=event.data.params?.[key];if(typeof value==='string')current.searchParams.set(key,value);else current.searchParams.delete(key);}history.replaceState(null,'',current);return;
      }
      if(event.data?.type==='gravuru-fk-close'){editor.hidden=true;intro.hidden=false;}
    });
    // K9: Direktlink ?design=…&size=…&text=… öffnet den Editor sofort; der Editor liest und entfernt die Parameter.
    if(new URL(location.href).searchParams.get('model')==='acryl'||['configuration','group','design'].some(key=>new URL(location.href).searchParams.has(key)))open();
  </script>
</body>
</html>
