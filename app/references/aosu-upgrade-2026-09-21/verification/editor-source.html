/* A consistent mint surface identifies available controls. */
:host { --control-bg:#eaf5ef; --control-line:#86ad99; }
button:not(:disabled):not(.resize-handle):not(.primary) { background:var(--control-bg); border-color:var(--control-line); }
button:not(:disabled):hover { background:#d6eadf; border-color:#416f58; }
button.primary:not(:disabled) { background:#234e41; border-color:#234e41; color:#fff; }
button.primary:not(:disabled):hover { background:#153d31; }
textarea:not(:disabled),input[type=text]:not(:disabled),input[type=number]:not(:disabled),select:not(:disabled),input[type=color]:not(:disabled) {
  background:#edf8f2; border:1.5px solid var(--control-line); box-shadow:inset 0 1px 2px #234e4108;
}
textarea:focus,input:focus,select:focus { border-color:#356b51; }
.option-row:has(input:not(:disabled)),.check-guide:has(input:not(:disabled)) { background:var(--control-bg); border:1px solid var(--control-line); border-radius:7px; padding:8px; }
input[type=range] { accent-color:#356b51; background:var(--control-bg); border-radius:8px; min-height:24px; }
.tabs button[aria-selected=true],.layer[aria-pressed=true],.design-card[aria-pressed=true] { background:#cce6d7!important; border-color:#356b51!important; color:#173c2d; }
.tabs button[aria-selected=true] { box-shadow:inset 0 0 0 1px #356b51; }
/* Small visible grips, with a transparent 28px hit area around each. */
.resize-handle { width:16px; height:16px; min-height:16px; border-width:1.5px; border-radius:4px; font-size:11px; box-shadow:0 1px 3px #173b3020; }
.resize-handle::before { content:""; position:absolute; inset:-6px; }
.resize-handle span { line-height:1; pointer-events:none; }
.upload:not(:disabled),.slot-properties { border:2px solid #67987d; background:#e3f2e9; border-radius:12px; box-shadow:0 4px 14px #234e4112; }
.upload:not(:disabled) { min-height:190px; padding:24px 14px; gap:14px; }
.upload strong { font-size:19px; line-height:1.3; color:#173f2b; }
.upload .icon { width:42px; height:42px; color:#234e41; }
.upload .muted { color:#385d49; }
.slot-properties { padding:18px 14px; margin-bottom:20px; }
.slot-properties,.photo-replace { scroll-margin-top:140px; scroll-margin-bottom:110px; }
.slot-properties h3 { font-size:19px; line-height:1.3; margin:0 0 12px; color:#173f2b; }
.slot-properties .muted { color:#385d49; font-size:14px; }
.slot-properties [data-do=upload],.photo-replace [data-do=upload] { background:#234e41!important; color:#fff; border-color:#234e41; min-height:58px; font-weight:700; }
.photo-replace { padding:16px; background:#e3f2e9; border:2px solid #67987d; border-radius:12px; margin-bottom:18px; }
.photo-replace p { font-size:14px; }
.photo-replace[hidden] { display:none; }
.fixed-photo > .field,.fixed-photo > .property-grid,.fixed-photo > .reset-rotation,.fixed-photo > .action-row,.fixed-photo > .color-properties { display:none; }
.scene [data-photo-field] { cursor:pointer; }
.scene [data-fixed-frame],.scene [data-fixed-frame] * { pointer-events:none; }
.multi-select { margin-bottom:20px; padding-bottom:18px; border-bottom:1px solid var(--line); }
.multi-options { padding:14px 0 0; }
.multi-options p { font-size:13px; color:#385d49; margin-bottom:12px; }
.multi-options .multi-count { font-weight:700; font-size:15px; }
.multi-options .multi-help { font-size:12px; margin:10px 0 0; }
.multi-options button { white-space:normal; line-height:1.4; min-height:54px; }
.multi-select [aria-pressed=true] { background:#cce6d7!important; border-color:#356b51!important; }
.multi-options[hidden],.edit-card[hidden] { display:none; }
@media(max-width:680px) {
  .resize-handle { width:18px; height:18px; min-height:18px; }
  .resize-handle::before { inset:-5px; }
  .upload:not(:disabled) { min-height:190px; }
}
